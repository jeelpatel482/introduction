<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aapka Swagat Hai! 🎉</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Outfit & Poppins -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Poppins:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brandPink: '#FF2E63',
                        brandYellow: '#FFDE7D',
                        brandCyan: '#00F5D4',
                        brandDark: '#0F172A',
                        cardDark: '#1E293B'
                    },
                    boxShadow: {
                        'glow-pink': '0 0 25px rgba(255, 46, 99, 0.5)',
                        'glow-cyan': '0 0 25px rgba(0, 245, 212, 0.5)',
                        '3d': '0 10px 0px 0px #0F172A',
                        '3d-pink': '0 8px 0px 0px #9F1239'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #1E1B4B 0%, #0F172A 100%);
            min-height: 100vh;
            color: #FFFFFF;
        }

        /* Pulse Animation for Button */
        @keyframes customPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .animate-custom-pulse {
            animation: customPulse 1.8s infinite ease-in-out;
        }

        /* Float effect */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-8px) rotate(2deg);
            }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Page Transitions */
        .fade-enter {
            opacity: 0;
            transform: scale(0.92) translateY(20px);
        }

        .fade-enter-active {
            opacity: 1;
            transform: scale(1) translateY(0px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

<body class="flex flex-col justify-between items-center min-h-screen px-4 py-8 relative overflow-x-hidden">

    <!-- Top Ambient Lights -->
    <div class="fixed -top-24 -left-24 w-72 h-72 bg-brandPink/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed -bottom-24 -right-24 w-72 h-72 bg-brandCyan/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header / Brand Tag -->
    <header class="w-full max-w-md text-center z-10">
        <div
            class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/20 text-xs sm:text-sm font-semibold tracking-wide text-brandYellow shadow-lg">
            <span>✨ Welcome To My Profile ✨</span>
        </div>
    </header>

    <!-- MAIN CARD CONTAINER -->
    <main class="w-full max-w-md my-auto z-10">

        <!-- ================= PAGE 1: WELCOME SCREEN ================= -->
        <div id="page1"
            class="bg-cardDark/90 backdrop-blur-xl border border-white/10 rounded-3xl p-6 sm:p-8 text-center shadow-2xl space-y-6 transition-all duration-500">

            <!-- User Photo Avatar Frame -->
            <div class="relative inline-block animate-float">
                <div
                    class="w-32 h-32 sm:w-40 sm:h-40 rounded-full p-1 bg-gradient-to-tr from-brandPink via-brandYellow to-brandCyan shadow-glow-pink mx-auto overflow-hidden">
                    <img src="photo1.png"
                        onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/bottts/svg?seed=Raj&backgroundColor=ffe600';"
                        alt="My Photo" class="w-full h-full object-cover rounded-full border-2 border-slate-900">
                </div>
                <!-- Emoji Sticker Overlay -->
                <span
                    class="absolute bottom-1 right-1 bg-brandPink text-xl p-2 rounded-full border-2 border-slate-900 shadow-md animate-bounce">
                    😄
                </span>
            </div>

            <!-- Text 1: Welcome Greeting -->
            <div class="space-y-2">
                <h1 class="font-outfit text-xl sm:text-2xl font-bold text-white leading-relaxed">
                    "Aap idher aaye vo jaan ke hame <span
                        class="text-brandYellow underline decoration-brandPink decoration-2 underline-offset-4">itniikhushiii hui</span>... me bata nahi sakta!"
                </h1>
            </div>

            <!-- Call to Action Prompt -->
            <div class="bg-indigo-950/60 p-4 rounded-2xl border border-indigo-500/30">
                <p class="text-sm sm:text-base font-medium text-indigo-200">
                    Aab aa hi gaye ho to iss button ko <span class="text-brandPink font-bold">pure jor se daba
                        do</span>, mujhe khushi hogi! 👇
                </p>
            </div>

            <!-- Interactive Big Button -->
            <div class="pt-2">
                <button id="mainBtn" onclick="goToPage2()"
                    class="w-full bg-gradient-to-r from-brandPink to-rose-600 hover:from-rose-500 hover:to-brandPink text-white font-outfit font-black text-xl py-4 rounded-2xl shadow-3d-pink hover:translate-y-0.5 active:translate-y-2 active:shadow-none transition-all duration-150 animate-custom-pulse flex items-center justify-center gap-3">
                    <span>DABA DO! 🚀</span>
                </button>
            </div>
        </div>


        <!-- ================= PAGE 2: 7 CRORE REVEAL SCREEN ================= -->
        <div id="page2"
            class="hidden relative bg-cardDark/90 backdrop-blur-xl border border-white/10 rounded-3xl p-6 sm:p-8 text-center shadow-2xl space-y-6 fade-enter">

            <!-- Top-Left Icon Back Button -->
            <button onclick="goToPage1()" title="Go Back"
                class="absolute top-4 left-4 w-10 h-10 bg-white/10 hover:bg-white/20 active:scale-90 text-white rounded-full border border-white/20 flex items-center justify-center transition-all duration-200 shadow-md">
                <i class="fas fa-arrow-left text-base"></i>
            </button>

            <!-- 7 Crore Animated Banner -->
            <div
                class="inline-block bg-brandYellow text-slate-950 font-outfit font-black text-3xl sm:text-4xl px-6 py-2 rounded-2xl border-4 border-slate-950 shadow-glow-cyan animate-bounce mt-2">
                7 CRORE!!! 🎉
            </div>

            <!-- Meme Image / GIF Display -->
            <div class="relative rounded-2xl overflow-hidden border-4 border-brandCyan/50 shadow-2xl group">
                <img src="meme.gif"
                    onerror="this.onerror=null; this.src='https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdW1pYWxocmI1NHJpNHBmeHRia2prbmE1MWQ5dDRreGZubXJtOW4ydyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKr3nzbh5WgCFxe/giphy.gif';"
                    alt="7 Crore KBC Meme"
                    class="w-full h-auto object-cover rounded-xl transform group-hover:scale-105 transition duration-300">
            </div>

            <p class="text-sm font-semibold text-gray-300">
                Aap jeet chuke hain pure <span class="text-brandCyan font-bold text-base">7 Crore</span> khushiyan! 🥳
            </p>

            <!-- Buttons Grid -->
            <div class="space-y-3 pt-2">
                <!-- Replay Confetti Button -->
                <button onclick="triggerConfettiAndSound()"
                    class="w-full bg-brandCyan text-slate-950 font-outfit font-bold text-base py-3.5 rounded-xl shadow-md hover:bg-cyan-300 active:scale-95 transition flex items-center justify-center gap-2">
                    <i class="fas fa-magic"></i> Phir Se Daba Ke Dekho! ✨
                </button>

                <!-- Instagram Return Link -->
                <a href="https://instagram.com" target="_blank"
                    class="w-full bg-white/10 hover:bg-white/20 text-white font-semibold text-sm py-3 rounded-xl border border-white/20 transition flex items-center justify-center gap-2">
                    <i class="fab fa-instagram text-brandPink"></i> Wapas Instagram Pe Chale?
                </a>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center text-xs text-gray-400 z-10 pt-4">
        <p>Created with ❤️ just for fun!</p>
    </footer>

    <!-- AUDIO SYNTHESIZER & PAGE SWITCH LOGIC -->
    <script>
        // Web Audio API Synth to ensure instant sound feedback without missing audio files
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playCelebrationSound() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            // Arpeggio Fanfare (C-E-G-C)
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + (index * 0.1));

                gain.gain.setValueAtTime(0.3, now + (index * 0.1));
                gain.gain.exponentialRampToValueAtTime(0.001, now + (index * 0.1) + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + (index * 0.1));
                osc.stop(now + (index * 0.1) + 0.35);
            });
        }

        // Confetti Fireworks Burst
        function fireConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#FF2E63', '#FFDE7D', '#00F5D4', '#FFFFFF']
                });
            }
        }

        function triggerConfettiAndSound() {
            playCelebrationSound();
            fireConfetti();
        }

        // Go to Page 2 Transition
        function goToPage2() {
            triggerConfettiAndSound();

            const p1 = document.getElementById('page1');
            const p2 = document.getElementById('page2');

            p1.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                p1.classList.add('hidden');
                p2.classList.remove('hidden', 'opacity-0', 'scale-95');
                setTimeout(() => {
                    p2.classList.add('fade-enter-active');
                }, 50);
            }, 300);
        }

        // Go Back to Page 1 Transition
        function goToPage1() {
            const p1 = document.getElementById('page1');
            const p2 = document.getElementById('page2');

            p2.classList.remove('fade-enter-active');
            p2.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
                p2.classList.add('hidden');
                p1.classList.remove('hidden', 'opacity-0', 'scale-95');
            }, 300);
        }
    </script>
</body>

</html>
